name: verify-public-mesh

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve immutable ancestor and successors
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Verify explicit successor boundary
        run: python3 living-memory/scripts/verify_repository.py --root .
