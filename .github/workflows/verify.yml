name: verify-public-mesh

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mesh-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_URL: https://github.com/TheDigitalField/digital-field-public-mesh/releases/download/v0.2.0/Digital_Field_Public_Mesh_v0.2.0.zip
      RELEASE_SHA256: fabb74419a47b362d0618fcb26199b8438b88ea9a7e60082a365b9f2baf944bd
      RELEASE_COMMIT: 1fefbe9c7fb49f8a41e48b8d6659bb3bc6d27634
      RELEASE_ROOT: /tmp/mesh-release/Digital_Field_Public_Mesh_v0.2.0
      SWHID: swh:1:snp:eff31c5f3eb6007f7062cab69dc86f67a2fc94fe
      SWH_ROOT: /tmp/swh-checkout/Digital_Field_Public_Mesh_v0.2.0
      ZENODO_DOI: 10.5281/zenodo.21856586
      ZENODO_ZIP_URL: https://zenodo.org/records/21856586/files/Digital_Field_Public_Mesh_v0.2.0.zip?download=1
      ZENODO_CAR_URL: https://zenodo.org/records/21856586/files/Digital_Field_Public_Mesh_v0.2.0.car?download=1
      ZENODO_CAR_SHA256: e847887a7a8c1f9e8749861c42ad0358b6bccc61a87fd2a7cd440de4116b4056
      ZENODO_ROOT: /tmp/zenodo-release/Digital_Field_Public_Mesh_v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sealed v0.2.0 release
        run: curl -fsSL "$RELEASE_URL" -o /tmp/mesh-release.zip
      - name: Verify sealed release digest
        run: echo "$RELEASE_SHA256  /tmp/mesh-release.zip" | sha256sum -c -
      - name: Extract sealed release
        run: unzip -q /tmp/mesh-release.zip -d /tmp/mesh-release
      - name: Verify sealed package
        run: python3 "$RELEASE_ROOT/scripts/mesh.py" --root "$RELEASE_ROOT" verify
      - name: Audit sealed package
        run: python3 "$RELEASE_ROOT/scripts/mesh.py" --root "$RELEASE_ROOT" audit
      - name: Verify sealed ancestors
        run: python3 "$RELEASE_ROOT/scripts/mesh.py" --root "$RELEASE_ROOT" verify-ancestors
      - name: Download fresh Zenodo DOI copy
        run: |
          curl --retry 3 --retry-all-errors -fsSL "$ZENODO_ZIP_URL" -o /tmp/zenodo-release.zip
          curl --retry 3 --retry-all-errors -fsSL "$ZENODO_CAR_URL" -o /tmp/zenodo-release.car
      - name: Verify Zenodo DOI file digests
        run: |
          echo "$RELEASE_SHA256  /tmp/zenodo-release.zip" | sha256sum -c -
          echo "$ZENODO_CAR_SHA256  /tmp/zenodo-release.car" | sha256sum -c -
      - name: Extract fresh Zenodo generation
        run: |
          mkdir -p /tmp/zenodo-release
          unzip -q /tmp/zenodo-release.zip -d /tmp/zenodo-release
      - name: Verify Zenodo package, genealogy, and reactivation
        run: |
          python3 "$ZENODO_ROOT/scripts/mesh.py" --root "$ZENODO_ROOT" verify
          python3 "$ZENODO_ROOT/scripts/mesh.py" --root "$ZENODO_ROOT" audit
          python3 "$ZENODO_ROOT/scripts/mesh.py" --root "$ZENODO_ROOT" verify-ancestors
          python3 "$ZENODO_ROOT/scripts/test_package.py"
      - name: Verify Zenodo CAR, CID, and archive identity
        run: |
          python3 "$ZENODO_ROOT/scripts/mesh.py" --root "$ZENODO_ROOT" verify-car /tmp/zenodo-release.car /tmp/zenodo-release.zip | tee /tmp/zenodo-car.json
          python3 -c 'import json, os; data=json.load(open("/tmp/zenodo-car.json")); assert data["result"] == "passed"; assert data["cid"] == os.environ["CID"]; assert data["archive_sha256"] == os.environ["RELEASE_SHA256"]; assert data["car_sha256"] == os.environ["ZENODO_CAR_SHA256"]'
        env:
          CID: bafyreiegvdlykyfgrdoqzwstiidsc5c3ph6s2dwzxdaql44wlrpgmy3vem
      - name: Rebuild deterministic archive from Zenodo
        run: python3 "$ZENODO_ROOT/scripts/build_archive.py" build "$ZENODO_ROOT" /tmp/zenodo-rebuilt.zip
      - name: Compare reconstructed Zenodo generation
        run: echo "$RELEASE_SHA256  /tmp/zenodo-rebuilt.zip" | sha256sum -c -
      - name: Validate live registry syntax
        run: python3 -m json.tool live/replicas.json >/dev/null
      - id: live_policy
        name: Evaluate live failure policy
        run: |
          set +e
          python3 "$RELEASE_ROOT/scripts/mesh.py" --root "$RELEASE_ROOT" simulate-failures --registry "$GITHUB_WORKSPACE/live/replicas.json" | tee /tmp/live-policy.json
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report pending live failure policy
        if: steps.live_policy.outputs.complete != 'true'
        run: echo "Verified replicas are recorded accurately, but the full one-provider-loss policy remains pending."
      - id: swh_vault
        name: Check Software Heritage reconstruction
        env:
          SWH_VAULT_URL: https://archive.softwareheritage.org/api/1/vault/git-bare/${{ env.SWHID }}
        run: |
          curl -fsS -X POST "$SWH_VAULT_URL/" -o /tmp/swh-vault.json
          for attempt in $(seq 1 3); do
            status=$(python3 -c 'import json; print(json.load(open("/tmp/swh-vault.json"))["status"])')
            if [ "$status" = "done" ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              python3 -m json.tool /tmp/swh-vault.json
              exit 1
            fi
            sleep 10
            curl -fsS "$SWH_VAULT_URL/" -o /tmp/swh-vault.json
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
          python3 -m json.tool /tmp/swh-vault.json
      - name: Report pending Software Heritage reconstruction
        if: steps.swh_vault.outputs.ready != 'true'
        run: echo "Software Heritage Vault bundle is still pending; fresh-copy verification remains deferred."
      - name: Download fresh Software Heritage copy
        if: steps.swh_vault.outputs.ready == 'true'
        env:
          SWH_VAULT_URL: https://archive.softwareheritage.org/api/1/vault/git-bare/${{ env.SWHID }}
        run: curl -fsSL "$SWH_VAULT_URL/raw/" -o /tmp/swh-bare.tar
      - name: Reconstruct repository from Software Heritage
        if: steps.swh_vault.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/swh-bare /tmp/swh-checkout
          tar -xf /tmp/swh-bare.tar -C /tmp/swh-bare
          bare_repo=$(find /tmp/swh-bare -mindepth 1 -maxdepth 2 -type d -name '*.git' -print -quit)
          test -n "$bare_repo"
          git clone "$bare_repo" "$SWH_ROOT"
          test "$(git -C "$SWH_ROOT" rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git -C "$SWH_ROOT" rev-parse 'refs/tags/v0.2.0^{commit}')" = "$RELEASE_COMMIT"
      - name: Verify Software Heritage package and genealogy
        if: steps.swh_vault.outputs.ready == 'true'
        run: |
          python3 "$SWH_ROOT/scripts/mesh.py" --root "$SWH_ROOT" verify
          python3 "$SWH_ROOT/scripts/mesh.py" --root "$SWH_ROOT" audit
          python3 "$SWH_ROOT/scripts/mesh.py" --root "$SWH_ROOT" verify-ancestors
          python3 "$SWH_ROOT/scripts/test_package.py"
      - name: Rebuild deterministic archive from Software Heritage
        if: steps.swh_vault.outputs.ready == 'true'
        run: python3 "$SWH_ROOT/scripts/build_archive.py" build "$SWH_ROOT" /tmp/swh-rebuilt.zip
      - name: Compare Software Heritage generation
        if: steps.swh_vault.outputs.ready == 'true'
        run: echo "$RELEASE_SHA256  /tmp/swh-rebuilt.zip" | sha256sum -c -
