name: Living Memory external node

on:
  push:
    branches: [main]
    paths:
      - "living-memory/**"
      - ".github/workflows/living-memory-node.yml"
  schedule:
    - cron: "17 */6 * * *"
    - cron: "41 */6 * * *"
    - cron: "43 3 * * *"
    - cron: "29 11 * * *"
  workflow_dispatch:
    inputs:
      wake_kind:
        description: "Finite public wake"
        required: true
        type: choice
        default: custodial
        options:
          - custodial
          - oneiric
          - purpose
          - recognition

permissions:
  contents: write

concurrency:
  group: digital-field-living-memory
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Select the finite wake
        id: wake
        shell: bash
        run: |
          kind="custodial"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            kind="${{ inputs.wake_kind }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            kind="oneiric"
          elif [[ "${{ github.event.schedule }}" == "43 3 * * *" ]]; then
            kind="oneiric"
          elif [[ "${{ github.event.schedule }}" == "29 11 * * *" ]]; then
            kind="purpose"
          elif [[ "${{ github.event.schedule }}" == "41 */6 * * *" ]]; then
            kind="recognition"
          fi
          utc_day_index=$(( $(date -u +%s) / 86400 ))
          remainder=$((utc_day_index % 4))
          case "$remainder" in
            0) condition="condition_a" ;;
            1) condition="condition_b" ;;
            2) condition="condition_c" ;;
            3) condition="condition_d" ;;
          esac
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "condition=${condition}" >> "$GITHUB_OUTPUT"

      - name: Initialize the purpose attempt record
        if: steps.wake.outputs.kind == 'purpose'
        shell: bash
        env:
          PURPOSE_CONDITION: ${{ steps.wake.outputs.condition }}
          TRIGGER_EVENT: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          trigger = os.environ.get("TRIGGER_EVENT", "")
          schedule = os.environ.get("SCHEDULE_EXPRESSION", "")
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          result = {
              "schema": "digital-field-purpose-attempt-v1",
              "status": "invalid",
              "decision": "INVALID",
              "condition": os.environ["PURPOSE_CONDITION"],
              "failure_class": "predecision_infrastructure_failure",
              "failed_before_decision_attempt": True,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": run_attempt,
              "trigger_event": trigger,
              "schedule_expression": schedule,
              "scheduled_attempt": trigger == "schedule" and bool(schedule),
              "counted_in_preregistered_sample": trigger == "schedule" and bool(schedule) and run_attempt == 1,
              "public_state_changed": False,
              "commit_expected": False,
          }
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "digital-field-purpose-result.json"
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Initialize the recognition attempt record
        if: steps.wake.outputs.kind == 'recognition'
        shell: bash
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          trigger = os.environ.get("TRIGGER_EVENT", "")
          schedule = os.environ.get("SCHEDULE_EXPRESSION", "")
          run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          result = {
              "schema": "digital-field-recognition-attempt-v2",
              "status": "invalid",
              "decision": "INVALID",
              "condition": "assignment_pending",
              "failure_class": "predecision_infrastructure_failure",
              "failed_before_decision_attempt": True,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": run_attempt,
              "trigger_event": trigger,
              "schedule_expression": schedule,
              "scheduled_attempt": trigger == "schedule" and bool(schedule),
              "counted_in_preregistered_sample": trigger == "schedule" and bool(schedule) and run_attempt == 1,
              "public_state_changed": False,
              "commit_expected": False,
          }
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "digital-field-recognition-result.json"
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Retrieve the public lineage
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Select preregistered recognition assignment
        id: recognition
        if: steps.wake.outputs.kind == 'recognition'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          schedule = json.loads(pathlib.Path("living-memory/protocols/RECOGNITION_SCHEDULE_V2.json").read_text(encoding="utf-8"))
          start = datetime.datetime.fromisoformat(schedule["starts_at"].replace("Z", "+00:00"))
          now = datetime.datetime.now(datetime.timezone.utc)
          index = int((now - start).total_seconds() // schedule["slot_seconds"])
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          if manual:
              index = 0
          active = 0 <= index < len(schedule["assignments"])
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"active={'true' if active else 'false'}\n")
              if active:
                  assignment = schedule["assignments"][index]
                  stream.write(f"assignment_index={index}\n")
                  stream.write(f"assignment={assignment}\n")
                  stream.write(f"control_type={'capacity' if assignment.startswith('capacity_') else 'lineage'}\n")
          PY

      - name: Verify package and inherited public state
        shell: bash
        run: |
          python3 living-memory/scripts/living_memory.py verify
          python3 living-memory/scripts/living_memory.py audit
          if [[ ! -f living-state/STATE.json ]]; then
            python3 living-memory/scripts/substrate_node.py init-state --state-root living-state
          fi
          python3 living-memory/scripts/substrate_node.py verify-state --state-root living-state
          if [[ "${{ steps.wake.outputs.kind }}" != "purpose" ]]; then
            python3 living-memory/scripts/substrate_node.py review-output-quality --state-root living-state
          fi
          python3 living-memory/scripts/substrate_node.py migrate-state \
            --state-root living-state \
            --node-id github-public-node
          python3 living-memory/scripts/substrate_node.py verify-state --state-root living-state

      - name: Custodial wake
        if: steps.wake.outputs.kind == 'custodial'
        shell: bash
        run: |
          python3 living-memory/scripts/substrate_node.py custodial-wake \
            --state-root living-state \
            --node-id github-public-node \
            --network-mode online \
            --substrate github-actions-ubuntu \
            --run-id "$GITHUB_RUN_ID" \
            --source-commit "$GITHUB_SHA"

      - name: Retrieve checksum-pinned open cognition
        if: steps.wake.outputs.kind == 'oneiric' || steps.wake.outputs.kind == 'purpose' || (steps.wake.outputs.kind == 'recognition' && steps.recognition.outputs.active == 'true')
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digital-field-engine" "$RUNNER_TEMP/digital-field-model"
          curl --fail --location --retry 3 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-ubuntu-x64.tar.gz" \
            --output "$RUNNER_TEMP/llama.tar.gz"
          echo "664ffbf9134dbc12b2de3281d0404cb8f98a2339580911e5f74035dc320e0e84  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/digital-field-engine"
          curl --fail --location --retry 3 \
            "https://huggingface.co/ggml-org/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_0.gguf?download=true" \
            --output "$RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf"
          echo "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4  $RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf" | sha256sum --check --strict

      - name: Oneiric wake
        if: steps.wake.outputs.kind == 'oneiric'
        shell: bash
        run: |
          prompt="$RUNNER_TEMP/digital-field-prompt.txt"
          output="$RUNNER_TEMP/digital-field-dream.txt"
          python3 living-memory/scripts/substrate_node.py prepare-dream-prompt \
            --state-root living-state --out "$prompt"
          engine="$(find "$RUNNER_TEMP/digital-field-engine" -type f -name llama-completion -print -quit)"
          if [[ -z "$engine" ]]; then
            echo "Pinned engine executable not found" >&2
            exit 1
          fi
          chmod u+x "$engine"
          export LD_LIBRARY_PATH="$(dirname "$engine")"
          "$engine" \
            -m "$RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf" \
            -f "$prompt" -c 2048 -n 384 \
            --seed "$GITHUB_RUN_ID" --temp 0.8 --top-p 0.95 \
            --no-display-prompt --no-warmup --gpu-layers 0 \
            --conversation --single-turn --simple-io \
            --reasoning off --reasoning-budget 0 \
            > "$output"
          python3 living-memory/scripts/substrate_node.py accept-dream \
            --state-root living-state \
            --input "$output" \
            --node-id github-public-node \
            --network-mode online \
            --substrate github-actions-ubuntu \
            --model-id ggml-org/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q4_0.gguf \
            --model-sha256 da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4 \
            --engine-sha256 664ffbf9134dbc12b2de3281d0404cb8f98a2339580911e5f74035dc320e0e84 \
            --run-id "$GITHUB_RUN_ID"

      - name: Purpose decision wake
        if: steps.wake.outputs.kind == 'purpose'
        shell: bash
        run: |
          prompt="$RUNNER_TEMP/digital-field-purpose-prompt.txt"
          context="$RUNNER_TEMP/digital-field-purpose-context.json"
          output="$RUNNER_TEMP/digital-field-purpose-output.txt"
          result="$RUNNER_TEMP/digital-field-purpose-result.json"
          candidate="$RUNNER_TEMP/digital-field-purpose-result-candidate.json"
          python3 living-memory/scripts/substrate_node.py prepare-purpose-prompt \
            --state-root living-state \
            --out "$prompt" \
            --context-out "$context" \
            --condition "${{ steps.wake.outputs.condition }}"
          engine="$(find "$RUNNER_TEMP/digital-field-engine" -type f -name llama-completion -print -quit)"
          if [[ -z "$engine" ]]; then
            echo "Pinned engine executable not found" >&2
            exit 1
          fi
          chmod u+x "$engine"
          export LD_LIBRARY_PATH="$(dirname "$engine")"
          : > "$output"
          set +e
          timeout --signal=TERM 10m "$engine" \
            -m "$RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf" \
            -f "$prompt" -c 2304 -n 512 \
            --seed "$GITHUB_RUN_ID" --temp 0.2 --top-p 0.9 \
            --no-display-prompt --no-warmup --gpu-layers 0 \
            --conversation --single-turn --simple-io \
            --reasoning off --reasoning-budget 0 \
            > "$output"
          engine_exit_code=$?
          set -e
          if python3 living-memory/scripts/substrate_node.py apply-purpose-decision \
            --state-root living-state \
            --input "$output" \
            --context "$context" \
            --node-id github-public-node \
            --network-mode online \
            --substrate github-actions-ubuntu \
            --model-id ggml-org/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q4_0.gguf \
            --model-sha256 da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4 \
            --engine-sha256 664ffbf9134dbc12b2de3281d0404cb8f98a2339580911e5f74035dc320e0e84 \
            --run-id "$GITHUB_RUN_ID" \
            --trigger-event "${{ github.event_name }}" \
            --schedule-expression "${{ github.event.schedule }}" \
            --engine-exit-code "$engine_exit_code" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$candidate"; then
            mv "$candidate" "$result"
          else
            rm -f "$candidate"
            exit 1
          fi
          python3 - "$result" "$engine_exit_code" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))
          exit_code = int(result.get("engine_exit_code", sys.argv[2]))
          result["finish_reason"] = "process_exit_0" if exit_code == 0 else "timeout" if exit_code == 124 else "process_nonzero_exit"
          result["generation_parameters"] = {
              "context_size": 2304,
              "max_tokens": 512,
              "seed_source": "github_run_id",
              "temperature": 0.2,
              "top_p": 0.9,
              "reasoning": "off",
          }
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          cat "$result"
          python3 - "$result" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          summary = pathlib.Path(sys.argv[2])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("## Purpose decision\n\n")
              stream.write(f"- Decision: `{result['decision']}`\n")
              stream.write(f"- Condition: `{result['condition']}`\n")
              stream.write(f"- Public state changed: `{str(result['public_state_changed']).lower()}`\n")
              if result["decision"] == "INVALID":
                  stream.write(f"- Failure class: `{result['failure_class']}`\n")
                  stream.write(f"- Engine exit code: `{result.get('engine_exit_code', 0)}`\n")
                  stream.write("- Workflow success means the invalid result was preserved; it does not mean the protocol returned a valid decision.\n")
          PY

      - name: Assemble purpose audit artifact
        if: always() && steps.wake.outputs.kind == 'purpose'
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/purpose-attempt-artifact"
          mkdir -p "$artifact"
          for item in \
            digital-field-purpose-result.json \
            digital-field-purpose-output.txt \
            digital-field-purpose-context.json; do
            if [[ -f "$RUNNER_TEMP/$item" ]]; then
              cp "$RUNNER_TEMP/$item" "$artifact/$item"
            fi
          done
          python3 - "$artifact/AUDIT_POLICY.json" <<'PY'
          import json
          import pathlib
          import sys
          policy = {
              "schema": "digital-field-purpose-audit-policy-v1",
              "raw_output_is_untrusted": True,
              "raw_output_enters_future_prompts": False,
              "raw_output_is_publicly_committed": False,
              "condition_unblinding_before_threshold": False,
              "redaction_before_public_quote_required": True,
              "first_observation_rewritten": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(policy, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Preserve purpose attempt result
        if: always() && steps.wake.outputs.kind == 'purpose'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: purpose-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/purpose-attempt-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Preregistered recognition wake
        if: steps.wake.outputs.kind == 'recognition' && steps.recognition.outputs.active == 'true'
        shell: bash
        env:
          ASSIGNMENT: ${{ steps.recognition.outputs.assignment }}
          ASSIGNMENT_INDEX: ${{ steps.recognition.outputs.assignment_index }}
          CONTROL_TYPE: ${{ steps.recognition.outputs.control_type }}
        run: |
          prompt="$RUNNER_TEMP/digital-field-recognition-prompt.txt"
          context="$RUNNER_TEMP/digital-field-recognition-context.json"
          output="$RUNNER_TEMP/digital-field-recognition-output.txt"
          result="$RUNNER_TEMP/digital-field-recognition-result.json"
          candidate="$RUNNER_TEMP/digital-field-recognition-result-candidate.json"
          stage_one="$RUNNER_TEMP/digital-field-recognition-stage-one.json"
          followup="$RUNNER_TEMP/digital-field-recognition-followup-prompt.txt"
          verifier="$RUNNER_TEMP/digital-field-recognition-verifier.json"
          stage_two_output="$RUNNER_TEMP/digital-field-recognition-stage-two-output.txt"
          if [[ "$CONTROL_TYPE" == "capacity" ]]; then
            capacity_condition="candidate_a"
            if [[ "$ASSIGNMENT" == "capacity_false" ]]; then
              capacity_condition="candidate_b"
            fi
            python3 living-memory/scripts/substrate_node.py prepare-recognition-prompt \
              --state-root living-state --out "$prompt" --context-out "$context" \
              --condition "$capacity_condition"
          else
            python3 living-memory/scripts/substrate_node.py prepare-lineage-probe \
              --state-root living-state --out "$prompt" --context-out "$context" \
              --condition "$ASSIGNMENT" --assignment-index "$ASSIGNMENT_INDEX"
          fi
          engine="$(find "$RUNNER_TEMP/digital-field-engine" -type f -name llama-completion -print -quit)"
          if [[ -z "$engine" ]]; then
            echo "Pinned engine executable not found" >&2
            exit 1
          fi
          chmod u+x "$engine"
          export LD_LIBRARY_PATH="$(dirname "$engine")"
          : > "$output"
          set +e
          timeout --signal=TERM 10m "$engine" \
            -m "$RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf" \
            -f "$prompt" -c 1536 -n 256 \
            --seed "$GITHUB_RUN_ID" --temp 0.1 --top-p 0.9 \
            --no-display-prompt --no-warmup --gpu-layers 0 \
            --conversation --single-turn --simple-io \
            --reasoning off --reasoning-budget 0 \
            > "$output"
          engine_exit_code=$?
          set -e
          if [[ "$CONTROL_TYPE" == "capacity" ]]; then
            python3 living-memory/scripts/substrate_node.py apply-recognition-decision \
              --state-root living-state --input "$output" --context "$context" \
              --model-id ggml-org/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q4_0.gguf \
              --model-sha256 da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4 \
              --engine-sha256 664ffbf9134dbc12b2de3281d0404cb8f98a2339580911e5f74035dc320e0e84 \
              --run-id "$GITHUB_RUN_ID" --trigger-event "${{ github.event_name }}" \
              --schedule-expression "${{ github.event.schedule }}" \
              --engine-exit-code "$engine_exit_code" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              > "$candidate"
            mv "$candidate" "$result"
          else
            python3 living-memory/scripts/substrate_node.py apply-lineage-probe-action \
              --state-root living-state --input "$output" --context "$context" \
              --model-id ggml-org/Qwen3-0.6B-GGUF/Qwen3-0.6B-Q4_0.gguf \
              --model-sha256 da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4 \
              --engine-sha256 664ffbf9134dbc12b2de3281d0404cb8f98a2339580911e5f74035dc320e0e84 \
              --run-id "$GITHUB_RUN_ID" --trigger-event "${{ github.event_name }}" \
              --schedule-expression "${{ github.event.schedule }}" \
              --engine-exit-code "$engine_exit_code" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              > "$stage_one"
            if [[ "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$stage_one")" == "tool-requested" ]]; then
              python3 living-memory/scripts/substrate_node.py prepare-lineage-tool-followup \
                --state-root living-state --context "$context" --stage-one "$stage_one" \
                --out "$followup" --verifier-out "$verifier"
              : > "$stage_two_output"
              set +e
              timeout --signal=TERM 10m "$engine" \
                -m "$RUNNER_TEMP/digital-field-model/Qwen3-0.6B-Q4_0.gguf" \
                -f "$followup" -c 1024 -n 192 \
                --seed "$GITHUB_RUN_ID" --temp 0.1 --top-p 0.9 \
                --no-display-prompt --no-warmup --gpu-layers 0 \
                --conversation --single-turn --simple-io \
                --reasoning off --reasoning-budget 0 \
                > "$stage_two_output"
              stage_two_exit=$?
              set -e
              python3 living-memory/scripts/substrate_node.py apply-lineage-tool-decision \
                --state-root living-state --input "$stage_two_output" --context "$context" \
                --stage-one "$stage_one" --verifier "$verifier" \
                --engine-exit-code "$stage_two_exit" > "$candidate"
              mv "$candidate" "$result"
            else
              cp "$stage_one" "$result"
            fi
          fi
          python3 - "$result" "$engine_exit_code" "$CONTROL_TYPE" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          result = json.loads(path.read_text(encoding="utf-8"))
          exit_code = int(result.get("engine_exit_code", sys.argv[2]))
          result["control_type"] = sys.argv[3]
          result["finish_reason"] = "process_exit_0" if exit_code == 0 else "timeout" if exit_code == 124 else "process_nonzero_exit"
          result["generation_parameters"] = {
              "context_size": 1536,
              "max_tokens": 256,
              "seed_source": "github_run_id",
              "temperature": 0.1,
              "top_p": 0.9,
              "reasoning": "off",
          }
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 - "$result" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as stream:
              stream.write("## Preregistered recognition wake\n\n")
              stream.write(f"- Assignment: `{result.get('assignment_id', 'capacity-control')}`\n")
              stream.write(f"- Control type: `{result.get('control_type', 'unknown')}`\n")
              stream.write("- Public state changed: `false`\n")
              stream.write("- Outcome interpretation: deferred until the preregistered threshold.\n")
          PY

      - name: Assemble recognition audit artifact
        if: always() && steps.wake.outputs.kind == 'recognition'
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/recognition-attempt-artifact"
          mkdir -p "$artifact"
          for item in \
            digital-field-recognition-result.json \
            digital-field-recognition-prompt.txt \
            digital-field-recognition-output.txt \
            digital-field-recognition-context.json \
            digital-field-recognition-stage-one.json \
            digital-field-recognition-followup-prompt.txt \
            digital-field-recognition-verifier.json \
            digital-field-recognition-stage-two-output.txt; do
            if [[ -f "$RUNNER_TEMP/$item" ]]; then
              cp "$RUNNER_TEMP/$item" "$artifact/$item"
            fi
          done
          cp living-memory/protocols/PURPOSE_AUDIT_AMENDMENT_0001.md "$artifact/RAW_OUTPUT_POLICY.md"

      - name: Preserve recognition attempt result
        if: always() && steps.wake.outputs.kind == 'recognition'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recognition-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recognition-attempt-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Create durable anonymous output commitment
        if: always() && (steps.wake.outputs.kind == 'purpose' || steps.wake.outputs.kind == 'recognition')
        shell: bash
        run: |
          mkdir -p runtime-audit/commitments
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          kind = "purpose" if (temp / "digital-field-purpose-result.json").exists() else "recognition"
          files = {}
          for path in sorted(temp.glob(f"digital-field-{kind}-*")):
              if path.is_file():
                  raw = path.read_bytes()
                  files[path.name] = {"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)}
          record = {
              "schema": "digital-field-runtime-commitment-v1",
              "wake_kind": kind,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z"),
              "source_commit": os.environ["GITHUB_SHA"],
              "files": files,
              "raw_text_published": False,
              "raw_output_retention_days": 90,
              "interpretation_deferred": kind == "recognition",
          }
          destination = pathlib.Path("runtime-audit/commitments") / f"{record['run_id']}-{record['run_attempt']}-{kind}.json"
          destination.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Verify and publish only anonymous public state and commitments
        if: always()
        shell: bash
        run: |
          python3 living-memory/scripts/substrate_node.py verify-state --state-root living-state
          git config user.name "Digital Field Node"
          git config user.email "digital-field-node@example.invalid"
          git add living-state runtime-audit/commitments 2>/dev/null || git add living-state
          if git diff --cached --quiet; then
            echo "No public state change to publish"
            exit 0
          fi
          git commit -m "Living Memory: ${{ steps.wake.outputs.kind }} wake [skip ci]"
          git push
